<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4b - Question 2</title>
</head>
<body>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button onclick="checkInput()">Check</button>

    <script>
        // Runs when the user clicks the "Check" button
        function checkInput() {
            // Get what the user typed
            const value = document.getElementById("userInput").value;

            // If it's empty or not a number
            if (value.trim() === "" || isNaN(value)) {
                alert("Please insert a number!");
            }
            // If it's lower than 10
            else if (value < 10) {
                alert("The number is lower than 10");
            }
            // Everything else
            else {
                alert("The number is higher than 10");
            }
        }
    </script>
</body>
</html>
